[package]
name = "cv-engine"
version = "0.1.0"
edition = "2024"
description = "Computer vision engine and WebAssembly pipeline for physical jigsaw puzzle solving"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stbn/jigsaw-puzzle-solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }


[dependencies]
serde_json = "1.0"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Performance",
  "console"
]

