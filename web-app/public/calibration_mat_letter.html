<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Optical Calibration Target (US Letter)</title>
  <style>
    @page {
      size: letter portrait; /* 8.5in x 11in = 215.9mm x 279.4mm */
      margin: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 8.5in;
      height: 11in;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      font-family: monospace;
    }
    .sheet {
      width: 8.5in;
      height: 11in;
      position: relative;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* THE RECTIFIED FIDUCIAL STAGE (Exact 100mm x 100mm outer boundary) */
    .fiducial-stage {
      width: 100mm;
      height: 100mm;
      position: relative;
      background: #ffffff;
      box-sizing: border-box;
      /* Non-intrusive outer alignment boundary */
      border: 0.5mm solid #000000;
    }

    /* 4 Sub-pixel Corner Fiducial Markers:
       Standard concentric high-gradient bullseye + crosshair quadrant.
       Gives optimal Hessian matrix eigenvalues / Harris corner response. */
    .fiducial-marker {
      position: absolute;
      width: 16mm;
      height: 16mm;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-left     { top: 0; left: 0; }
    .top-right    { top: 0; right: 0; }
    .bottom-right { bottom: 0; right: 0; }
    .bottom-left  { bottom: 0; left: 0; }

    /* Concentric binary rings for sub-pixel centroid refinement */
    .ring-outer {
      width: 15mm;
      height: 15mm;
      background: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .ring-middle {
      width: 9mm;
      height: 9mm;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-center {
      width: 4mm;
      height: 4mm;
      background: #000000;
      border-radius: 50%;
    }

    /* Precision crosshairs passing through marker center for sub-pixel alignment */
    .marker-cross-h {
      position: absolute;
      width: 16mm;
      height: 0.25mm;
      background: #ffffff;
      top: 7.875mm;
      left: 0;
    }
    .marker-cross-v {
      position: absolute;
      width: 0.25mm;
      height: 16mm;
      background: #ffffff;
      left: 7.875mm;
      top: 0;
    }

    /* ZERO-REFLECTION MATTE STAGING ARENA:
       Pure white, completely free of lines or text to ensure Otsu binarization
       and morphological boundary tracking encounter ZERO false edges. */
    .piece-arena {
      position: absolute;
      top: 20mm;
      left: 20mm;
      width: 60mm;
      height: 60mm;
      box-sizing: border-box;
      background: #ffffff;
    }

    /* Micro-fine center crosshair: 0.15mm line thickness (hairline reference) */
    .center-reticle-h {
      position: absolute;
      top: 29.925mm;
      left: 26mm;
      width: 8mm;
      height: 0.15mm;
      background: #bbbbbb;
    }
    .center-reticle-v {
      position: absolute;
      left: 29.925mm;
      top: 26mm;
      width: 0.15mm;
      height: 8mm;
      background: #bbbbbb;
    }

    /* OPTICAL DENSITY & RADIOMETRIC CALIBRATION BAR
       Positioned along bottom perimeter outside the piece segmentation arena. */
    .radiometric-strip {
      position: absolute;
      bottom: 2mm;
      left: 20mm;
      width: 60mm;
      height: 6mm;
      display: flex;
      box-sizing: border-box;
      border: 0.2mm solid #000000;
    }
    .patch {
      flex: 1;
      height: 100%;
    }
    .patch-0   { background: #000000; } /* D-max */
    .patch-25  { background: #404040; } /* 25% reflectance */
    .patch-50  { background: #777777; } /* 18%-50% mid-tone gray */
    .patch-75  { background: #bfbfbf; } /* 75% reflectance */
    .patch-100 { background: #ffffff; } /* D-min */

    /* METRIC VERIFICATION RULER (Millimeter Scale along top perimeter) */
    .metric-scale {
      position: absolute;
      top: 3mm;
      left: 20mm;
      width: 60mm;
      height: 4mm;
      display: flex;
      border-bottom: 0.3mm solid #000000;
    }
    .tick-10mm {
      width: 10mm;
      height: 100%;
      border-right: 0.25mm solid #000000;
      box-sizing: border-box;
      font-size: 5pt;
      color: #000;
      padding-top: 1mm;
      text-align: right;
      padding-right: 0.5mm;
    }

    /* Peripheral Framing Targets (for automatic quad detection without manual drag) */
    .corner-tick-tl { position: absolute; top: 18mm; left: 18mm; width: 3mm; height: 3mm; border-top: 0.3mm solid #000; border-left: 0.3mm solid #000; }
    .corner-tick-tr { position: absolute; top: 18mm; right: 18mm; width: 3mm; height: 3mm; border-top: 0.3mm solid #000; border-right: 0.3mm solid #000; }
    .corner-tick-br { position: absolute; bottom: 18mm; right: 18mm; width: 3mm; height: 3mm; border-bottom: 0.3mm solid #000; border-right: 0.3mm solid #000; }
    .corner-tick-bl { position: absolute; bottom: 18mm; left: 18mm; width: 3mm; height: 3mm; border-bottom: 0.3mm solid #000; border-left: 0.3mm solid #000; }

    /* Minimal machine-readable metadata */
    .target-id {
      position: absolute;
      bottom: -6mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 6pt;
      color: #666666;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="fiducial-stage">
      <!-- 4 Corner Sub-Pixel Concentric Ring Fiducials (Centers at exactly [8mm, 8mm], [92mm, 8mm], [92mm, 92mm], [8mm, 92mm]) -->
      <div class="fiducial-marker top-left">
        <div class="ring-outer">
          <div class="marker-cross-h"></div>
          <div class="marker-cross-v"></div>
          <div class="ring-middle">
            <div class="ring-center"></div>
          </div>
        </div>
      </div>

      <div class="fiducial-marker top-right">
        <div class="ring-outer">
          <div class="marker-cross-h"></div>
          <div class="marker-cross-v"></div>
          <div class="ring-middle">
            <div class="ring-center"></div>
          </div>
        </div>
      </div>

      <div class="fiducial-marker bottom-right">
        <div class="ring-outer">
          <div class="marker-cross-h"></div>
          <div class="marker-cross-v"></div>
          <div class="ring-middle">
            <div class="ring-center"></div>
          </div>
        </div>
      </div>

      <div class="fiducial-marker bottom-left">
        <div class="ring-outer">
          <div class="marker-cross-h"></div>
          <div class="marker-cross-v"></div>
          <div class="ring-middle">
            <div class="ring-center"></div>
          </div>
        </div>
      </div>

      <!-- Millimeter Metric Calibration Scale (60mm span = 10mm increments) -->
      <div class="metric-scale">
        <div class="tick-10mm">10</div>
        <div class="tick-10mm">20</div>
        <div class="tick-10mm">30</div>
        <div class="tick-10mm">40</div>
        <div class="tick-10mm">50</div>
        <div class="tick-10mm">60</div>
      </div>

      <!-- Framing Boundary Crop Ticks -->
      <div class="corner-tick-tl"></div>
      <div class="corner-tick-tr"></div>
      <div class="corner-tick-br"></div>
      <div class="corner-tick-bl"></div>

      <!-- Pristine White Piece Staging Zone (Zero noise, zero text, pure background) -->
      <div class="piece-arena">
        <div class="center-reticle-h"></div>
        <div class="center-reticle-v"></div>
      </div>

      <!-- 5-Step Radiometric Gray-Card Ramp for Gain/Gamma/White-Balance Normalization -->
      <div class="radiometric-strip">
        <div class="patch patch-0"></div>
        <div class="patch patch-25"></div>
        <div class="patch patch-50"></div>
        <div class="patch patch-75"></div>
        <div class="patch patch-100"></div>
      </div>

      <div class="target-id">
        CALIBRATION-TARGET: 100mm x 100mm | FIDUCIAL-DELTA: 84.00mm | SCALE: 1:1
      </div>
    </div>
  </div>
</body>
</html>
