<div class="canvas-root">
  <!-- Viewport Header Toolbar -->
  <div class="viewport-header border-b">
    <div class="header-left">
      <span class="header-title">POSTER REFERENCE</span>
    </div>

    <!-- View Mode Switches & Display Controls -->
    <div class="mode-toggles">
      @for (mode of viewModes; track mode.id) {
        <button
          type="button"
          class="toggle-btn"
          [class.active]="posterStore.viewMode() === mode.id"
          (click)="setViewMode(mode.id)"
          [title]="mode.hint"
        >
          {{ mode.label }} [{{ mode.shortcut }}]
        </button>
      }

      <button
        type="button"
        class="toggle-btn"
        [class.active]="posterStore.showGrid()"
        (click)="toggleGrid()"
        title="Toggle piece grid lines [G]"
      >
        GRID: {{ posterStore.showGrid() ? 'ON' : 'OFF' }} [G]
      </button>
      <button
        type="button"
        class="toggle-btn reset-btn"
        (click)="resetView()"
        title="Center and fit viewport [0]"
      >
        FIT [0]
      </button>
    </div>
  </div>

  <!-- Interactive 2D Canvas Viewport -->
  <div
    #viewportRef
    class="canvas-viewport"
    (wheel)="onWheel($event)"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp($event)"
    (mouseleave)="onMouseLeave()"
  >
    <canvas #canvasRef class="board-canvas"></canvas>
  </div>
</div>
