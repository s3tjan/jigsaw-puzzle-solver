<div class="shell-root">
  <!-- 30px Utility Toolbar -->
  <app-toolbar></app-toolbar>

  <!-- Transient Command Palette (Section 6.5) -->
  @if (appModeStore.isCommandPaletteOpen()) {
    <app-command-palette></app-command-palette>
  }

  <!-- Main Operational Split Workspace -->
  <main class="workspace-split">
    <!-- MODE: POSTER (Alt+1 / Calibration, Clustering & Trays) -->
    @if (appModeStore.activeMode() === 'POSTER') {
      <app-tray-studio></app-tray-studio>
    }

    <!-- MODE: INGESTION (Alt+2 / Continuous Drop Mat) -->
    @if (appModeStore.activeMode() === 'INGESTION') {
      <app-ingestion-scanner></app-ingestion-scanner>
    }

    <!-- MODE: WORKBENCH (Alt+3 / Assembly HUD) -->
    @if (appModeStore.activeMode() === 'WORKBENCH') {
      <app-workbench></app-workbench>
    }
  </main>

  <!-- 24px Bottom Telemetry Status Strip -->
  <app-status-bar></app-status-bar>
</div>
