<aside class="frontier-root border-r">
  <div class="inverted-header">
    <span>OPEN SLOTS ({{ boardStore.frontierCount() }})</span>
    <span class="shortcut-tag font-mono">[Alt+B]</span>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width: 70px;">SLOT</th>
          <th style="width: 80px;">NEIGHBORS</th>
          <th>REQUIRED EDGES</th>
        </tr>
      </thead>
      <tbody>
        @for (slot of boardStore.frontierSlots(); track slot.r + '-' + slot.c) {
          <tr 
            [class.selected]="isSelected(slot)"
            (click)="boardStore.selectSlot(slot)"
          >
            <td class="font-mono">R{{ slot.r + 1 }} C{{ slot.c + 1 }}</td>
            <td class="font-mono text-center">{{ slot.placedNeighborCount || 0 }} placed</td>
            <td class="font-mono">{{ formatPolarities(slot) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</aside>
